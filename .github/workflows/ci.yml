# Build, test and budget on every push. No secrets: deploys are signed by hand from a laptop.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @dcl/sdk-commands uses fs.globSync, a Node 22 API. Pinned in package.json via Volta.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
